# Data
data_path: "russian_spam.csv"
text_column: "message"
label_column: "label"

# Model
model_name: "distilbert/distilbert-base-uncased"
num_labels: 2
max_length: 128

# Training
learning_rate: 0.00002
batch_size: 32
num_epochs: 5
weight_decay: 0.01
warmup_steps: 100

# Split
test_size: 0.4
val_ratio: 0.5
random_seed: 42

# Sampling (for faster training, use subset)
max_train_samples: 100000

# Output
output_dir: "./spam_classifier"
logging_steps: 100
