name: Tests & Docker

on:
  push:
    branches: [main, master, hw1, hw2]
  pull_request:
    branches: [main, master, hw1, hw2]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas scikit-learn numpy
    
    - name: Run tests
      run: |
        cd tests && pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Lint Dockerfile (offline inference)
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: error
    
    - name: Lint Dockerfile (TorchServe)
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: torchserve/Dockerfile
        failure-threshold: error
    
    - name: Build TorchServe image (test)
      run: |
        # Create dummy model-store for build test
        mkdir -p torchserve/model-store
        touch torchserve/model-store/.gitkeep
        cd torchserve && docker build -t spam-serve:test . --no-cache
    
    - name: Verify TorchServe image
      run: |
        docker images spam-serve:test
        echo "TorchServe image built successfully"
